# Consolidated 2026-09-29 from five separate curation passes (remote/WLB seeds, priority-A
# candidates, .NET/Azure demand, Puget-Sound-local + vertical-SaaS, and a batch of named leads)
# into one alphabetized file — the old files are gone; discovery_source on each entry still
# records which curation pass originally found it, so that context is not lost.
#
# active=true means the ats_type/board_id is a real, live-verified, currently-crawlable board.
# active=false means the real ATS has no adapter yet (see AtsType in jobscan/models.py for which
# platforms are supported) or the board could not be found/verified. Companies whose only board
# was confirmed to carry zero US postings across every historical crawl were removed entirely
# rather than kept inactive — see git history, not this file, for that record.
#
# Evidence levels:
#   current_role_verified   = a current role/board recently demonstrated the fit directly
#   current_board_verified  = live board verified via a direct API call with a real job count
#   recurring_stack         = plausible/likely based on known industry or company-technology
#                             patterns, not a specific verified current posting
#   monitor_only            = real but weaker signal (uncertain remote policy, big generalist
#                             employer, mixed stack, or an inconclusive live-verification result)
#
# Healthcare/health-systems and clearance-heavy defense/aerospace roles are intentionally
# excluded throughout, per the candidate's explicit "no security clearance" limitation.

