# Curated on 2026-09-17 for a Seattle-based senior backend/data engineer.
#
# Purpose: replace a prestige-heavy registry with employers whose products or
# engineering organizations repeatedly create demand for C#/.NET, Azure,
# APIs/integrations, SQL, or Python/data-platform experience.
#
# This is an employer prefilter, not a claim that every current opening fits.
# Every posting must still pass U.S.-remote, Washington eligibility, full-time,
# published base compensation, current application status, and exact required-
# qualification checks. Healthcare companies and OneStream are intentionally
# omitted.
#
# active means the board is currently crawlable by the existing Greenhouse,
# Ashby, or Lever adapters. It does NOT mean the employer is better or is hiring
# a matching role today. Unsupported and custom boards are retained as
# active=false so future adapters or browser discovery can cover them honestly.
#
# Evidence levels:
#   current_role_verified  = a current role/board recently demonstrated the fit
#   current_board_verified = live board verified; matching role may not be open
#   recurring_stack        = strong repeated historical/organizational fit
#   monitor_only           = plausible, but remote/pay/opening frequency is weak

