# Non-secret application settings. Secrets (API keys) go in .env / environment variables.

db_path: data/jobscan.db
output_dir: out

# Anthropic model used for both job evaluation and company classification.
# Keep this here (not hard-coded) so it can be swapped without touching code.
anthropic_model: claude-sonnet-5
anthropic_max_retries: 3
anthropic_timeout_seconds: 60

# Cheap first-pass screen (jobscan.llm.triage) run before the full job evaluation: a fast, lenient
# yes/no on whether a posting is worth the expensive full evaluation at all, using a smaller/
# cheaper model. Validated against 692 historical evaluations before enabling: 0 false negatives
# on the 3 known genuine matches, ~89% of real rejects correctly flagged skippable. Leave unset
# (blank/removed) to disable triage entirely and send every posting straight to full evaluation.
triage_model: claude-haiku-4-5-20251001

# USD list price per 1M tokens (checked 2026-10-07), used only to estimate run cost in reports.
# Update if pricing changes; unrecognized models report cost as "n/a".
anthropic_pricing:
  claude-sonnet-5:
    input_per_million: 2.00
    output_per_million: 10.00
  claude-haiku-4-5-20251001:
    input_per_million: 1.00
    output_per_million: 5.00

# Compensation rule.
min_base_salary: 170000

# Candidate's employment-eligible state, used for remote-location screening.
candidate_state: WA
candidate_state_name: Washington

log_level: INFO

# HTTP behavior for source adapters.
http_timeout_seconds: 30
http_user_agent: "JobScan/0.5 (+personal job search tool)"
