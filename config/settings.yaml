# Non-secret application settings. Secrets (API keys) go in .env / environment variables.

db_path: data/jobscan.db
output_dir: out

# Your personal files, all in one folder: JOBSCAN_DATA_DIR (in .env), or the repo's gitignored
# private/ when unset. Point JOBSCAN_DATA_DIR at a synced folder (Google Drive, OneDrive) and every
# `run` also backs the database up there. The files' names:
personal_files:
  profile: candidate_profile.yaml
  applications: applications.yaml
  registry: jobscan_companies.yaml

# Anthropic model used for both job evaluation and company classification.
# Keep this here (not hard-coded) so it can be swapped without touching code.
anthropic_model: claude-sonnet-5-5
# thinking.type sent with its calls. The evaluation reasons in its answer's field order (see
# CLAUDE.md), so thinking stays off; Sonnet 5.5 spells that between_tools (disabled is a 400 there,
# and between_tools is a 400 on every other model). Blank leaves the model's default.
anthropic_thinking: between_tools
anthropic_max_retries: 3
anthropic_timeout_seconds: 60

# Cheap first-pass screen (jobscan.llm.triage) run before the full job evaluation: a fast, lenient
# yes/no on whether a posting is worth the expensive full evaluation at all, using a smaller/
# cheaper model. A skip only stands when it quotes the posting for an allowed category (see
# CLAUDE.md). Leave unset (blank/removed) to disable triage entirely and send every posting
# straight to full evaluation.
triage_model: claude-haiku-5-5
# Thinking on would need a larger triage max_tokens (thinking counts toward it).
triage_thinking: disabled

# USD list price per 1M tokens (checked 2026-10-18), used only to estimate run cost in reports.
# Update if pricing changes; unrecognized models report cost as "n/a". Haiku 5.5's rate is for
# prompts of 100K tokens or fewer (every call here); longer prompts cost 5x.
anthropic_pricing:
  claude-sonnet-5-5:
    input_per_million: 2.00
    output_per_million: 10.00
  claude-sonnet-5:
    input_per_million: 2.00
    output_per_million: 10.00
  claude-haiku-5-5:
    input_per_million: 0.10
    output_per_million: 0.50
  claude-haiku-4-5-20251001:
    input_per_million: 1.00
    output_per_million: 5.00

# The candidate's salary floor, employment-eligible state and time zone are read from the
# candidate profile (min_base_salary, candidate_state, candidate_state_name, candidate_time_zone),
# which lives outside the repository — see config/candidate_profile.example.yaml.

log_level: INFO

# HTTP behavior for source adapters.
http_timeout_seconds: 30
# Boards fetched at once during a crawl (each adapter also runs its own small detail-page pool).
# Many boards share a host (Greenhouse's API, Workday clusters), so keep this modest.
crawl_workers: 4
# Postings whose LLM calls run at once during `evaluate` (a --limit run goes one at a time, so the
# cap is exact). Observed: 6 workers re-evaluated 372 postings in about 25 minutes with no rate-limit
# errors; one at a time that's hours.
evaluate_workers: 4
http_user_agent: "JobScan/0.5 (personal job search tool)"
