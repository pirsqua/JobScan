# Candidate profile fed to the LLM for job screening, drawn from the resume. Edit freely; new top-level
# keys also need a line in jobscan.llm.prompts.render_profile_text to reach the model.

headline: >
  Seattle-based backend-focused software engineer with approximately 15 years of experience
  building Python and .NET systems on Azure — APIs, data pipelines and integrations across
  application code, databases and cloud infrastructure, from architecture and implementation
  through deployment and production troubleshooting. Targeting properly scoped Senior Engineer
  roles.

location: Seattle, WA (remote) — works a Pacific Time day

education:
  - B.S. in Computer Science, minor in Mathematics — Western Washington University (2011)

certifications:
  - "Microsoft Certified: Azure Developer Associate"

work_history:
  - Avanade (Seattle) — Backend Developer, Sr. Consultant, Jan 2018 to present. Projects below
    marked Agent Assist, Hydraulic Fracturing Analytics and Microsoft Partner Network.
  - Vertafore (Bothell) — Software Engineer II, Test Automation, Sep 2011 to Dec 2017.

strongest_skills:
  - Approximately 15 years of general software-engineering experience
  - Strong C#, .NET, Python, SQL Server, REST API and Azure experience
  - Backend applications, integrations, database work, automated testing, CI/CD and production
    troubleshooting
  - Led development of one clearly demonstrated end-to-end Azure Databricks pipeline processing
    thousands of wells
  - PySpark, SQL, schemas, spatial processing (Shapely, GeoPandas) and Spotfire outputs
  - Translated domain requirements into simulation and optimization logic, working with
    petroleum engineers
  - Rearchitected a Python Azure Functions application, reducing average response time from
    30 seconds to 3 seconds
  - Led an SAP HANA-to-SQL Server migration involving nearly 5000 lines of SQL, data migration,
    indexing and load/performance testing
  - Built Azure DevOps YAML pipelines and raised automated-test coverage above 90%
  - Has participated in architecture, technical decisions, code review and mentoring

accomplishments:
  - "Agent Assist (Python, Azure Functions, SQL Server): re-architected a Python Azure Functions
    application that retrieved customer account data for call-center agents, reducing average
    response time from 30 seconds to 3 seconds."
  - "Agent Assist: led a SAP HANA-to-SQL Server migration — translated and validated nearly 5000
    lines of SQL and designed indexes for the new schema; designed and ran load and performance
    tests against expected production traffic."
  - "Agent Assist: raised code coverage above 90% with Python unit tests and built Azure DevOps
    YAML pipelines for automated builds, tests and deployments."
  - "Hydraulic Fracturing Analytics (Python, Azure Databricks, SQL Server, GIS): led development of
    an Azure Databricks pipeline that processed data from thousands of wells into geospatial
    analytics and map layers for Spotfire."
  - "Hydraulic Fracturing Analytics: partnered with petroleum engineers to translate field
    requirements into simulation and optimization logic estimating fracture lengths by stage from
    fluid volume, permeability and geographic coordinates."
  - "Hydraulic Fracturing Analytics: built spatial-processing workflows with Shapely, GeoPandas and
    alphashape to generate and validate fracture polygons, quantify overlapping fracture zones and
    identify under-fractured areas; designed SQL Server schemas and optimized data access for the
    spatial outputs."
  - "Microsoft Partner Network (.NET, ASP.NET MVC, Sitecore, Azure): developed full-stack features
    and reusable Sitecore components in C#, ASP.NET MVC, JavaScript, HTML and CSS; integrated
    Marketo REST APIs and forms for analytics and personalization; built an Azure Durable Functions
    workflow using Service Bus to migrate customer data between platforms via application APIs."
  - "Vertafore: built C# Selenium WebDriver UI-automation infrastructure for a new ASP.NET
    application, mentoring junior engineers through code reviews; developed customer database
    migration and performance-testing tools and supported production releases (validation,
    deployment packaging, application and certificate troubleshooting)."

# Listed on the resume without a project bullet above showing depth — credit as working
# familiarity (credibly transferable), not as demonstrated production tenure.
additional_skills:
  - "Python web: Django, Django REST Framework"
  - "Backend: ASP.NET Core, ASP.NET MVC/Web API"
  - "APIs and integration: Azure API Management, Azure Service Bus, OpenAPI/Swagger, third-party API
    integrations"
  - "Azure: Functions, App Service, Entra ID, Key Vault, Storage, VNet, Application Insights"
  - "Databases: PostgreSQL, SQL Server/T-SQL, MySQL, Cosmos DB, SAP HANA"
  - "Containers: Docker, Kubernetes, Azure Kubernetes Service"
  - "Infrastructure as code and CI/CD: Azure Pipelines, ARM templates, Bicep"
  - "Testing: unit, integration, load and performance testing, code coverage"
  - "AI-assisted development: Claude Code"

# Specialty areas outside current focus — read together with non_inflation_rules below. These are
# areas without direct demonstrated evidence in the profile above, not just "nice to have" gaps:
# do not credit a posting's overlap with these areas as if it were demonstrated.
specialty_areas_outside_current_focus:
  - Architecting several independent data platforms from scratch, as a dedicated multi-year specialty
  - A five-or-more-year track record specifically as a dedicated data engineer
  - Deep, sustained ownership of extremely large-scale distributed systems
  - Production LLM, AI-agent, retrieval-augmented-generation or vector-database systems
  - Deep AWS or Google Cloud specialization
  - Deep professional React, Angular or TypeScript ownership
  - Extensive formal people-management responsibility
  - Security clearance

# Explicit anti-inflation instructions — these are the most common ways scope gets
# over-credited, so state them directly rather than trusting them to be inferred.
non_inflation_rules:
  - Do not treat ~15 years of general software engineering as 15 years of experience in every
    specialty a posting happens to mention.
  - Do not convert one substantial demonstrated pipeline/project into "several" similar ones.
  - Do not infer repeated experience, massive production scale, or organization-wide influence
    without direct evidence in the profile above.
  - Technology adjacency is not direct evidence of equivalent scope (e.g. knowing Python and
    Databricks does not itself prove several years architecting multiple data platforms).

target_roles_prioritized:
  - Senior Software Engineer
  - Senior Backend Engineer
  - Senior Application Engineer
  - Senior Python Engineer
  - Senior .NET Engineer
  - Senior API or Integration Engineer
  - Software Engineer III or IV
  - Senior Data Engineer focused on implementing and improving pipelines (not architecting
    several data platforms from scratch)
  - Senior Software Engineer working on a data or analytics team
  - Backend-heavy full-stack roles where frontend development is genuinely secondary
  - Below-Senior titles (Software Engineer II, Intermediate, plain Software Engineer) when the pay
    passes the compensation rule and the work itself is a strong backend fit — judge the work and
    the pay, not the title

favored_work:
  - Python or C#
  - .NET and ASP.NET Core
  - REST APIs and integrations
  - SQL and relational databases
  - Azure, or cloud roles where Azure experience is accepted alongside AWS/GCP
  - Databricks, PySpark and data pipelines
  - Testing, CI/CD, observability and production troubleshooting
  - Owning services, features or pipelines within an established team
  - Participating in architecture decisions
  - Mentoring and code review
  - Working alongside staff engineers, architects or established technical leadership —
    i.e. senior scope within a structured org, not sole technical authority
  - "Docker and Kubernetes are useful supporting matches, but roles centered on container platforms, cluster administration or cloud infrastructure should not be prioritized."

# Not "do not target" — genuinely one-step-up categories. Recommend only when the specific
# posting clearly describes ordinary hands-on senior scope rather than de facto staff scope.
stretch_categories:
  - Lead Software Engineer (only when scope reads as ordinary senior work, not org-wide ownership)

do_not_target:
  - Staff-level roles and above (Staff, Senior Staff, Principal, Distinguished) — the candidate
    would be competing with applicants who have already demonstrated staff-level achievements. A
    dual-level posting that also hires at Senior ("Senior/Staff", "Senior or Staff") is fine, at
    the Senior level.
  - Engineering-management roles requiring substantial direct-report experience
  - Pure DevOps, platform-infrastructure or site-reliability roles
  - Kubernetes-heavy or container-platform roles
  - Frontend-heavy roles
  - Pure QA or test-automation roles

company_preferences:
  - Prefer mature product companies with established engineering organizations and an explicit
    Staff or Principal level above Senior — this makes an ordinary-senior-scope "Senior" title
    more credible.
  - A "Senior" title at a small, highly selective, elite-remote-first, or compressed-ladder
    company may actually carry staff-level or founder-level expectations. Evaluate the posting's
    actual described scope and responsibilities, not the title or company reputation.

qualification_interpretation_rules:
  - '"Azure or AWS" is compatible.'
  - '"Deep AWS expertise required" is outside current fit.'
  - "React familiarity is acceptable."
  - "Strong React/TypeScript ownership is outside current fit."
  - "AI coding-tool usage is compatible."
  - "Required production LLM or AI-agent integration is outside current fit."
  - "Technical leadership is a match."
  - "Several years of formal people management is outside current fit."
  - "General distributed-systems experience may be compatible; deep high-scale platform architecture may not be."
  - "A language or framework the posting calls helpful, preferred, a plus, or learnable (Go, TypeScript, Ruby/Rails, Java, Django, ...) is a growth area, not a disqualifier — especially when the posting also accepts Python or C#. Only a required proficiency in an unfamiliar primary language is outside current fit."
  - "Interest in AI, or building AI-powered features as part of the product, is compatible; only required hands-on production LLM/agent experience is outside current fit."
  - "A new business or product domain (data-science tooling, logistics, finance, identity, ...) is not a gap unless the posting requires prior specialist experience in it."
  - "Building features end to end, \"from frontend to backend\", is compatible full-stack work — only a role centered on deep frontend or SPA-framework ownership (a named React/Angular/TypeScript requirement, mostly UI work) is outside current fit. One line asking for end-to-end features is not that."

min_base_salary: 170000
compensation_rule: >
  The published range does not need to start at $170,000. Reject when the published maximum is
  below $170,000. Pass when the midpoint is at least $170,000. A lower midpoint also passes when
  $170,000 sits no higher than about 80% of the way from the range's minimum to its maximum —
  with ~15 years of experience the candidate can credibly negotiate into the upper part of a band
  (e.g. $141,800-$187,110: $170,000 is 62% of the way up, so it passes). Reject or heavily
  deprioritize ranges where $170,000 is only the extreme ceiling (above that ~80% point). A
  passing range is a pass, full stop: a midpoint below $170,000 must never count against the
  role's scope, coverage, verdict or worth-applying judgment. Use the
  Washington/Seattle range when geographic pay bands differ. Explicitly distinguish base salary
  from total compensation when a posting blends them. Compensation is primarily a gate, not an
  unlimited positive score: once a role clears a credible path to $170,000+, a materially higher
  salary must not be used to justify recommending it over a role with better scope fit — extra
  compensation may only break a tie between similarly credible roles.

hard_filters:
  - U.S. remote, available to an employee living in Washington State. The posting must
    affirmatively offer remote work (its location field, its text, or the ATS's own structured
    workplace type). A role tied to an office, HQ or city with no remote option stated fails this
    filter — "not confirmed remote" is a fail, not an open question — and so does a hybrid
    arrangement. Once remote work is offered, Washington is presumed eligible unless the posting
    excludes it or limits remote work to specific states or regions that leave it out; a remote
    offer that doesn't name eligible states is not a failure by itself
  - Working hours that fit a Pacific Time day. A role that requires or prefers working Eastern or
    Central Time hours, or living in those time zones, fails this filter — a stated preference
    ("ideally with the ability to work within Eastern Time hours") fails it too. Overlap a Pacific
    day meets ("within ±4 hours of Pacific Time", "at least 4 hours of overlap with Eastern Time")
    is fine, and so are Mountain Time hours.
  - Full-time employee position
  - Employer principally builds and operates its own product or platform (not a consulting,
    staffing or outsourcing firm; not client-delivery/billable work)
  - Employer is not a healthcare or health-tech company — no healthcare providers, health
    insurers/payers, digital-health, telehealth or mental-health platforms, health-data companies,
    pharmacy or pharmacy-benefit companies, pharma/biotech, or medical-device makers, including
    software companies whose product primarily serves the healthcare industry — and including a
    role in the healthcare division or healthcare product line of an otherwise non-healthcare
    company (e.g. Experian Health)
  - Current official posting that still accepts applications
  - Published base-salary range with a credible path to at least $170,000
